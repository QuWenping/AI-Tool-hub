name: Apply AdSense Snippet

on:
  push:
    paths:
      - .github/workflows/apply-adsense.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add AdSense snippet to HTML heads
        run: |
          python <<'PY'
          from pathlib import Path

          marker = 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3930397953691472'
          snippet = '''    <!-- Google AdSense -->
          <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3930397953691472"
               crossorigin="anonymous"></script>
          '''

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              raw = path.read_bytes()
              has_bom = raw.startswith(b'\xef\xbb\xbf')
              text = raw.decode('utf-8-sig')

              if marker in text:
                  continue
              if '</head>' not in text:
                  raise RuntimeError(f'{path} has no closing </head> tag')

              text = text.replace('</head>', snippet + '</head>', 1)
              data = text.encode('utf-8')
              if has_bom:
                  data = b'\xef\xbb\xbf' + data
              path.write_bytes(data)
              changed.append(str(path))

          workflow = Path('.github/workflows/apply-adsense.yml')
          if workflow.exists():
              workflow.unlink()

          print('Updated HTML files:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit AdSense changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add Google AdSense code to HTML pages"
          git push
