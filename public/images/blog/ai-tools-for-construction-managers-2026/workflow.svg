<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="t d">
  <title id="t">Construction AI workflow</title>
  <desc id="d">Five steps from project plan to safety and progress review.</desc>
  <defs>
    <style>
      .box { fill:#f6f8fc; stroke:#3b5bdb; stroke-width:1.5; }
      .ai  { fill:#e8f0ff; stroke:#3b5bdb; stroke-width:1.5; }
      .arr { stroke:#6c757d; stroke-width:1.5; fill:none; marker-end:url(#a); }
      .lbl { font: 600 14px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; fill:#0d1b2a; text-anchor:middle; }
      .sub { font: 400 12px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; fill:#495057; text-anchor:middle; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6c757d"/>
    </marker>
  </defs>
  <g><rect class="box" x="20"  y="70" width="130" height="80" rx="8"/><text class="lbl" x="85"  y="105">Project Data</text><text class="sub" x="85"  y="125">P6, Procore, MS Project</text></g>
  <g><rect class="ai"  x="180" y="70" width="140" height="80" rx="8"/><text class="lbl" x="250" y="105">ChatGPT / Claude</text><text class="sub" x="250" y="125">Schedules, narratives</text></g>
  <g><rect class="ai"  x="350" y="70" width="140" height="80" rx="8"/><text class="lbl" x="420" y="105">Dify / n8n</text><text class="sub" x="420" y="125">Safety Q&amp;A, workflows</text></g>
  <g><rect class="box" x="520" y="70" width="120" height="80" rx="8"/><text class="lbl" x="580" y="105">OSHA / Project CM</text><text class="sub" x="580" y="125">Engineer-of-record review</text></g>
  <g><rect class="box" x="670" y="70" width="70"  height="80" rx="8"/><text class="lbl" x="705" y="105">Issue</text><text class="sub" x="705" y="125">Sign &amp; publish</text></g>
  <g fill="none" stroke="#6c757d" stroke-width="1.5" marker-end="url(#a)">
    <path d="M150 110 L180 110"/><path d="M320 110 L350 110"/><path d="M490 110 L520 110"/><path d="M640 110 L670 110"/>
  </g>
  <text class="sub" x="380" y="200" text-anchor="middle" fill="#6c757d">AI drafts and routes. The CM and OSHA review still own the project.</text>
</svg>
