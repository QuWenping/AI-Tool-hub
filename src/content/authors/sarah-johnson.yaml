name: Sarah Johnson
role: Senior Content Editor
bio: >
  Sarah Johnson is a digital marketing veteran with 8 years of experience in content strategy
  and AI-powered marketing tools. She has helped numerous brands develop and execute content
  strategies using cutting-edge AI writing assistants, SEO tools, and social media automation
  platforms. Sarah's expertise lies in evaluating how AI tools can streamline content creation
  workflows, improve editorial quality, and drive audience engagement. She has led content
  teams at digital agencies and SaaS companies, giving her a unique perspective on both the
  creative and analytical sides of content marketing. Sarah holds a degree in Communications
  and frequently speaks at industry conferences about the intersection of AI and content
  strategy. She is passionate about helping content creators leverage AI to work smarter
  without sacrificing authenticity and quality.
