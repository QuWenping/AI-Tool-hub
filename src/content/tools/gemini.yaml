  en: Generous free tier · Gemini Advanced $20/mo unlocks 2M context and Gemini Live.
faq:
- q_en: What can Gemini do that ChatGPT cannot?
  a_en: >-
    Native video understanding, a 2-million-token context window, and deep Google Search integration.
- q_en: Does Gemini support voice?
  a_en: Yes. Gemini Live offers real-time voice conversations with natural intonation.
- q_en: Is Gemini free?
  a_en: >-
    Base Gemini is free. Gemini Advanced costs $20/month for higher limits and features.
