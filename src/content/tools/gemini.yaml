editorialIntro: >-
  Gemini 2.5 Pro is Google's flagship multimodal assistant. The 2M-token context window is the largest in the industry, the
  Google Search integration is the deepest, and Gemini Live delivers the most natural-sounding voice mode.
editorialVerdict:
  best: >-
    You work with multimodal content (video, audio, images) or live research; Google Search integration is deepest and Gemini
    Live is the best voice mode.
  avoid: Your main workload is long-form English writing — Claude reads more naturally.
