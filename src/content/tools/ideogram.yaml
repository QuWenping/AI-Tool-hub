faq:
- q_en: What is Ideogram?
  a_en: >-
    Ideogram is an AI image generator from a Toronto-based team of ex-Google researchers, focused on accurate text rendering
    inside images.
- q_en: Is Ideogram free?
  a_en: >-
    Yes. The free plan allows a daily quota of generations; paid plans start at $8/month.
- q_en: Why is Ideogram good at text in images?
  a_en: >-
    Ideogram's architecture and training data are optimized for typographic accuracy, which is the hardest problem for most
    diffusion models.
- q_en: How does Ideogram compare to Midjourney?
  a_en: >-
    Midjourney produces more aesthetic imagery; Ideogram wins for posters, logos, mockups, and any image that contains real
    text.
- q_en: Does Ideogram have an API?
  a_en: >-
    Yes. The Ideogram API exposes image generation, inpainting, and style references for paid users.
- q_en: What is Ideogram Canvas?
  a_en: >-
    Canvas is Ideogram's in-browser editor for extending, inpainting, and re-styling generated images.
- q_en: Can I use Ideogram images commercially?
  a_en: >-
    Paid plans include commercial usage rights; the free plan is for personal use. Always check the latest terms on Ideogram's
    site.
- q_en: What aspect ratios does Ideogram support?
  a_en: >-
    Ideogram supports square, portrait, landscape and several print/social aspect ratios up to high resolutions on paid plans.
- q_en: Does Ideogram support styles and references?
  a_en: >-
    Yes. You can upload a style or character reference to maintain visual consistency across generations.
- q_en: Who should use Ideogram?
  a_en: >-
    Designers, marketers, and indie founders who need on-brand visuals with real text inside them.
