faq:
- q_en: Is GitHub Copilot free?
  a_en: >-
    Free for verified students, open-source maintainers, and teachers. Others start at $10/month.
- q_en: Does Copilot support multi-file editing?
  a_en: >-
    Copilot Chat handles some multi-file edits; for repo-wide agent work Cursor is more capable.
- q_en: Which languages does Copilot support?
  a_en: 30+ languages including Python, JavaScript/TypeScript, Go, Rust, Java and C#.
