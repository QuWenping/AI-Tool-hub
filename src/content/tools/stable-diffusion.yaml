editorialIntro: >-
  Stable Diffusion 3.5 is the strongest open-source image model. Pick it when you need total control, custom styles, or zero
  per-image cost — and are comfortable with LoRAs, ControlNets and a decent GPU.
editorialVerdict:
  best: >-
    You want total control, custom styles or zero per-image cost, and you can handle LoRAs, ControlNets and a decent GPU.
  avoid: Command-line tools and GPU setup are a barrier — use Midjourney or DALL-E.
