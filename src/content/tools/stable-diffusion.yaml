faq:
- q_en: Do I need a GPU for Stable Diffusion?
  a_en: >-
    Yes for local runs; cloud hosts (RunDiffusion, ThinkDiffusion) work without local hardware.
- q_en: How does SD compare with Midjourney?
  a_en: >-
    SD offers more control (LoRA, ControlNet, ComfyUI) but a steeper learning curve; Midjourney is easier for stylish output.
- q_en: Is commercial use allowed?
  a_en: Yes, subject to the Stability AI community license.
