pricingSummary:
  en: >-
    Individual completion + chat: free forever · Teams $12/seat/mo (SSO + shared context) · Enterprise custom (self-hosted,
    air-gapped).
faq:
- q_en: Is Codeium really free?
  a_en: >-
    Yes for individuals. Unlimited code completion and chat with no credit card. Team collaboration, SSO, and shared context
    libraries move to the $12/seat/month plan.
- q_en: How does Codeium make money if it is free?
  a_en: >-
    Enterprise deals: self-hosted deployments for banks, defense, healthcare and other regulated industries. The Windsurf
    IDE also monetizes power users on top of the same Codeium core.
- q_en: How does Codeium compare with GitHub Copilot?
  a_en: >-
    Autocomplete quality is close in 2026. Codeium wins on price (free vs $10/month), language breadth and IDE coverage (10+
    IDEs). Copilot has richer chat and multi-file features and deeper GitHub integration.
- q_en: Does Codeium train on my code?
  a_en: >-
    By default no — telemetry only. Enterprise plans add contractual zero-data-retention and on-prem deployment for teams
    that cannot send code to the public cloud.
- q_en: Which IDEs does Codeium support?
  a_en: >-
    VS Code, JetBrains suite, Neovim, Vim, Emacs, Sublime, Xcode, Android Studio, Eclipse and Chrome DevTools. Codeium's Windsurf
    editor is a full VS Code fork built on the same engine.
- q_en: Can Codeium do multi-file refactor like Cursor?
  a_en: >-
    The free extension focuses on completion + single-file chat. For repo-wide agentic edits, upgrade to Codeium's Windsurf
    IDE, which unlocks Cascade multi-file agent runs.
- q_en: How many languages does Codeium support?
  a_en: >-
    Officially 70+, including Python, TypeScript/JavaScript, Go, Rust, Java, C#, C/C++, Kotlin, Swift, PHP, Ruby, Elixir,
    Lua, and shell dialects. Quality is highest on the top 20 languages.
- q_en: Is Codeium good for students?
  a_en: >-
    Yes — the free tier is one of the best deals in AI coding right now. No credit card, unlimited completion, works in VS
    Code and JetBrains which most CS courses already use.
- q_en: Can Codeium run offline?
  a_en: >-
    Individual plans require the cloud service. Enterprise plans offer on-prem servers so the entire completion pipeline can
    run inside your VPC or fully air-gapped network.
- q_en: Is Codeium the same as Windsurf?
  a_en: >-
    Same company, different products. Codeium is the free IDE extension focused on completion and chat. Windsurf is the paid
    AI-native IDE with agentic Cascade workflows built on top of Codeium's engine.
