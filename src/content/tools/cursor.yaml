editorialIntro: >-
  Cursor is a VS Code fork with GPT-4-level AI, codebase chat, and multi-file agent mode built in. It can refactor across
  dozens of files, generate whole features from a description, and chat about your entire codebase.
editorialVerdict:
  best: >-
    You are a full-time developer refactoring code, debugging unfamiliar codebases and shipping features every week. The $20/month
    Pro plan pays back within days.
  avoid: >-
    You only code a few hours a week or you refuse to leave JetBrains — stick with Copilot.
