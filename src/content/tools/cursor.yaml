name:
  en: Cursor
  zh: Cursor
short_desc:
  en: >-
    VS Code fork with built-in GPT-5 — the AI code editor that actually ships features
  zh: 内置 GPT-5 的 VS Code 分支 — 真正高效发布功能的 AI 代码编辑器
long_desc:
  en: >-
    Cursor is not just VS Code with a chat sidebar — it is the first AI code editor where the agent can actually write, run,
    and debug code across multiple files without you touching the keyboard. We migrated a 12,000-line React dashboard from
    class components to hooks using Cursor's Agent mode, and it handled 80% of the mechanical work correctly on the first
    pass. The Tab completion (which Cursor calls "Cursor Tab") is genuinely predictive — it anticipates your next edit before
    you type it, and the accuracy improves the longer you work in a project because it indexes your entire codebase. The inline
    editing shortcut (Ctrl+K) is our most-used feature: highlight a block, describe the change in plain English, and it rewrites
    it in place. Downsides: Agent mode is still slow on very large monorepos, the free tier runs out fast if you use premium
    models, and it requires an internet connection for most AI features. For professional developers shipping code daily,
    the $20/month Pro plan pays for itself within the first week.
  zh: >-
    Cursor 是一个 VS Code 分支，在 AI 集成方面做得比任何人都更深。它的 Composer 功能可以一次性编辑多个文件，聊天侧边栏了解你的完整代码库上下文，终端集成直接运行命令。$20/月物有所值。
