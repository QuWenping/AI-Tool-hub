faq:
- q_en: What is Luma?
  a_en: >-
    Luma is an AI video generation company best known for Dream Machine, which turns text and image prompts into realistic
    short videos.
- q_en: Is Luma free?
  a_en: >-
    Yes. Luma offers a free tier with daily generations; paid plans start at $9.99/month for more generations and higher resolution.
- q_en: How does Luma compare to Sora?
  a_en: >-
    Luma's Dream Machine is competitive on realism and faster on iteration; Sora still leads on long-form coherent shots.
    Pick by workflow speed vs. shot length.
- q_en: Does Luma support image-to-video?
  a_en: >-
    Yes. Image-to-video is one of Dream Machine's strongest paths: upload a still, prompt the motion, get a 5-second clip.
- q_en: Can I extend Luma videos?
  a_en: >-
    Yes. You can extend a clip by using its last frame as a new keyframe and prompting the next 5 seconds.
- q_en: What is Luma Ray2?
  a_en: >-
    Ray2 is Luma's latest video model, with improved physics, prompt adherence, and human motion quality over Ray1.
- q_en: Does Luma have an API?
  a_en: >-
    Yes. Luma exposes a REST API for Dream Machine and Ray2, useful for batch workflows and app integration.
- q_en: Is Luma good for product videos?
  a_en: >-
    Yes. Many brands use Dream Machine to animate product stills into 5-second looping clips for social ads.
- q_en: Can Luma generate sound?
  a_en: >-
    Luma focuses on visuals. For voiceover, use ElevenLabs; for music, use Suno or Udio.
- q_en: Who should use Luma?
  a_en: >-
    Creators who need fast, realistic image-to-video and don't mind short clip lengths that can be chained.
