faq:
- q_en: Is Perplexity a search engine or a chatbot?
  a_en: Both. It answers like a chatbot but cites live sources for every claim.
- q_en: Does Perplexity replace Google?
  a_en: >-
    For research and product comparison it is often faster; for navigational search Google is still preferred.
