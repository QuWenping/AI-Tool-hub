use_cases:
  en:
  - Fact-check claims before publishing blog posts or reports
  - Compare SaaS tools by features, pricing, and user reviews side by side
  - Research regulatory compliance requirements with official source citations
  - Summarize breaking news with timeline and source tracking
  - Analyze competitor websites and marketing strategies systematically
  - Answer technical questions with documentation and Stack Overflow references
  - Prepare meeting briefs with verifiable market data and statistics
  zh:
  - 发布博客或报告前核实声明
  - 从功能、定价和用户评价多维度对比 SaaS 工具
  - 研究法规合规要求并附官方来源引用
  - 按时间线和来源追踪总结突发新闻
  - 系统分析竞品网站和营销策略
  - 结合文档和 Stack Overflow 回答技术问题
  - 用可验证的市场数据和统计准备会议简报
