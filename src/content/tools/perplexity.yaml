name:
  en: Perplexity
  zh: Perplexity
short_desc:
  en: >-
    AI-powered research engine that cites every claim — our go-to for fact-checked answers
  zh: 每句话都标注来源的 AI 研究引擎 — 我们做事实核查的首选
long_desc:
  en: >-
    Perplexity solved the biggest trust problem with AI — it shows you where every answer came from. When our team was researching
    GDPR compliance requirements for a product launch, Perplexity returned a structured answer with 12 inline citations to
    the official EU regulation text, ICO guidance, and relevant court rulings, all verifiable in one click. ChatGPT's browse
    mode gave us a similar answer but without the source granularity — we had to manually cross-check each claim. The Pro
    Search feature (unlimited on the $20/month Pro plan) does multi-step research autonomously: ask "compare the privacy policies
    of the top 5 project management SaaS tools" and it will search, read, and synthesize across multiple pages before answering.
    Perplexity is not a replacement for Google when you know exactly which page you want (navigational search), but for research
    questions, product comparisons, and anything where source verification matters, it is now our default starting point.
cat: productivity
url: https://perplexity.ai
icon: fa-search
scenes:
  en:
  - Academic research
  - News tracking
  - Purchase
  - Tech explain
  zh:
  - 事实核查研究
  - 市场分析
  - 学术调研
  - 新闻写作
pros:
  en:
  - Every claim is backed by an inline citation — click to verify
  - Pro Search performs multi-step autonomous research across sources
  - Collections feature organizes research by project with persistent context
  - File upload support lets you ask questions about your own PDFs and docs
  - No ads or sponsored results — answer quality is the only ranking signal
  - Mobile app has a voice search mode that works well for quick fact checks
  - API access enables programmatic research workflows for internal tools
  zh:
  - 每句话附带来源链接
  - 事实准确性显著高于竞品
  - 免费版已足够大多数用途
  - 每条声明都附带可点击验证的内联引用
  - Pro Search 可跨多个来源执行多步骤自主研究
  - Collections 功能按项目组织研究并保持上下文
  - 文件上传支持对自己的 PDF 和文档提问
cons:
  en:
  - Not designed for navigational search — Google is still faster for URLs
  - Pro Search depth sometimes sacrifices speed for thoroughness
  - Free tier Pro Search quota is limited to 5 per day
  - Answer quality depends on source quality — weak sources produce weak answers
  zh:
  - 不擅长创意写作
  - 代码能力一般
  - 中文来源覆盖不如英文
  - 不适合导航搜索——查 URL 还是 Google 更快
