editorialIntro: >-
  Perplexity is the AI search engine that cites its sources. For research, market intelligence and product decisions it is
  dramatically faster than Google plus opening a dozen tabs.
editorialVerdict:
  best: >-
    You do regular research, market intelligence or investment work and need cited sources.
  avoid: >-
    You need a general assistant with plugins or the deepest multimodal — pick ChatGPT Plus or Gemini.
