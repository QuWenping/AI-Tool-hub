faq:
- q_en: Is Windsurf free to use?
  a_en: >-
    Yes. The free tier ships Cascade agent and autocomplete with a monthly credit cap. Pro at $15/month unlocks 500 prompt
    credits and higher-tier models.
- q_en: How does Windsurf compare to Cursor?
  a_en: >-
    Cursor emphasizes hand-guided edits and codebase chat; Windsurf's Cascade agent leans more autonomous, executes commands
    and iterates until tests pass. Windsurf's free tier is more generous; Cursor's plugin ecosystem is bigger.
- q_en: What is Cascade Agent?
  a_en: >-
    Cascade is Windsurf's autonomous coding agent that reads the whole workspace, plans multi-step tasks, runs commands, edits
    multiple files and can retry until objectives are met — all inside the IDE.
- q_en: Can Windsurf run against my own model?
  a_en: >-
    Yes. Team and Enterprise plans support custom endpoints for OpenAI-compatible APIs, Azure OpenAI, and self-hosted models
    via LiteLLM-style proxies.
- q_en: Is Windsurf a VS Code fork?
  a_en: >-
    Yes. It is built on the VS Code open-source base, so most VS Code extensions and keybindings work. Codeium plans a JetBrains
    variant on the same agent runtime.
- q_en: How good is Windsurf for large codebases?
  a_en: >-
    Cascade indexes the workspace and maintains long-term context per branch. In our testing it handles repos up to a few
    hundred thousand lines cleanly; beyond that you should scope work with folder filters.
- q_en: Does Windsurf work offline?
  a_en: >-
    Autocomplete works with local models via Windsurf's on-device inference; agentic and chat features require a network connection
    to the Codeium or your enterprise endpoint.
- q_en: Is Windsurf safe for proprietary code?
  a_en: >-
    Enterprise plans include zero-data-retention agreements, on-prem deployment and audit logging. On the free/Pro plans,
    code snippets sent for inference follow Codeium's public data policy — review it before uploading trade secrets.
- q_en: What language and framework support does Windsurf have?
  a_en: >-
    70+ languages including Python, TypeScript/JavaScript, Go, Rust, Java, C#, PHP, Kotlin and Swift. Cascade is stronger
    on TypeScript/Python/Go than niche languages like OCaml or Erlang.
- q_en: Is Windsurf worth switching from Cursor or Copilot?
  a_en: >-
    Try it side-by-side for a week. Windsurf wins if you rely on autonomous multi-step agent runs and want a generous free
    tier; Cursor wins if you prefer manual precision and richer plugins; Copilot wins if you never want to leave your existing
    IDE.
