pros:
  en:
  - v7 lighting and material rendering is the best in class by a clear margin
  - Style Reference feature enables consistent brand campaigns across generations
  - Web app removes Discord dependency — now a proper standalone product
  - Inpainting and outpainting produce seamless edits without visible seams
  - Character consistency across multiple prompts is now reliable in v7
  - Commercial license included from Standard plan upward
  zh:
  - 无与伦比的美学质量
  - 无需提示词工程即可出好图
