faq:
- q_en: Does Midjourney offer a free tier?
  a_en: No. Paid subscriptions start at $10/month.
- q_en: Where do I generate images?
  a_en: >-
    The web app and the Discord bot both work; the web app is the recommended default in 2026.
- q_en: Can I use Midjourney commercially?
  a_en: Standard and higher plans grant commercial usage rights.
