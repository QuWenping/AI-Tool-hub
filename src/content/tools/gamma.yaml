faq:
- q_en: What is Gamma?
  a_en: >-
    Gamma is an AI presentation tool that generates full slide decks from a text prompt, then lets you edit them in a Notion-like
    interface.
- q_en: Is Gamma free?
  a_en: Yes. Free users get 400 AI credits to start; paid plans start at $8/seat/month.
- q_en: How does Gamma compare to PowerPoint?
  a_en: >-
    Gamma is faster for first drafts from a prompt; PowerPoint still wins on pixel-perfect control and complex animations
    for enterprise decks.
- q_en: Can I export Gamma decks to PowerPoint?
  a_en: >-
    Yes. Gamma exports to PPTX and PDF; web links can also be shared as interactive presentations.
- q_en: Does Gamma support custom branding?
  a_en: >-
    Yes. Pro and above let you upload logos, brand colors, and fonts that apply across all generated decks.
- q_en: Can Gamma generate from a document?
  a_en: >-
    Yes. Paste a document or import a URL and Gamma will summarise it into a structured deck.
- q_en: Does Gamma have an API?
  a_en: >-
    An API is available for paid accounts, useful for embedding Gamma generation inside SaaS workflows.
- q_en: Is Gamma good for internal updates?
  a_en: >-
    Yes. Many teams use Gamma to turn weekly notes or dashboards into fast status decks; engagement analytics on Pro help
    track reads.
- q_en: Does Gamma support collaboration?
  a_en: Yes. Real-time co-editing and comments work like in Notion or Google Docs.
- q_en: Who should use Gamma?
  a_en: >-
    Anyone who needs to turn ideas into a polished deck in minutes, not hours — and is willing to trade pixel-perfect control
    for speed.
