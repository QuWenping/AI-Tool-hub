faq:
- q_en: Is ChatGPT free to use?
  a_en: >-
    Yes. The free tier ships current-generation models mini. The $20/month Plus plan adds current-generation models, image
    generation, and voice mode.
- q_en: What is ChatGPT best for?
  a_en: >-
    General thinking, drafting, and quick research. It is the strongest all-round assistant we tested for daily productivity.
- q_en: How does ChatGPT compare with Claude?
  a_en: >-
    ChatGPT is more well-rounded with voice, image and plugins; Claude produces more natural long-form writing and handles
    longer documents.
- q_en: Does ChatGPT have an API?
  a_en: Yes. OpenAI exposes GPT models via the OpenAI API with usage-based pricing.
