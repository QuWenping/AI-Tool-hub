pros:
  en:
  - GPT-5 handles multi-step reasoning without explicit chain-of-thought prompting
  - Voice mode is genuinely faster than typing for quick questions
  - Custom instructions stick across sessions — set once, works forever
  - DALL·E integration means you never leave the chat for image generation
  - Code interpreter runs Python in-session for data analysis and charting
  - iOS/Android/Desktop apps sync conversation history seamlessly
  - Plugin + GPT Store ecosystem extends capabilities far beyond the base model
  zh:
  - 最通用的全能助手
  - 图像生成和数据分析原生集成
  - 插件生态丰富
  - 免费版足以满足大多数日常需求
  - GPT-5 无需显式思维链提示即可处理多步推理
  - 语音模式回答快速问题比打字更快
  - 自定义指令跨会话保持——设置一次永久生效
cons:
  en:
  - Occasional hallucination on niche or very recent topics
  - Default responses can be overly verbose without custom instructions
  - Plus tier occasionally hits capacity during peak US hours
  - No native real-time web search (browse mode is slower than Perplexity)
  zh:
  - 高峰时段仍有使用限制
  - 中文创意写作不如英文自然
  - 冷门或非常新的主题偶有幻觉
  - 默认回复可能过于冗长
