faq:
- q_en: What is Canva AI?
  a_en: >-
    Canva AI is the AI feature set inside Canva (Magic Write, Magic Design, Magic Edit, Magic Animate) that helps non-designers
    create on-brand visuals.
- q_en: Is Canva free?
  a_en: >-
    Yes. The free plan is generous; Pro ($13/mo) unlocks Magic Studio and the full template library.
- q_en: Do I need design skills to use Canva AI?
  a_en: >-
    No. Canva is built for non-designers; Magic Design can produce a complete layout from a text prompt or a single image.
- q_en: How good is Canva AI at generating images?
  a_en: >-
    Canva's image generation is convenient and on-brand but not state-of-the-art; for hero art, designers still prefer Midjourney
    or Flux Pro.
- q_en: Does Canva AI support brand consistency?
  a_en: >-
    Yes. Brand Kit (Pro and above) lets Magic Studio pull colors, fonts, and logos so every generated asset stays on-brand.
- q_en: Can I use Canva AI to make presentations?
  a_en: >-
    Yes. Magic Design for Presentations generates full decks from a topic or document; teams can also use AI to summarise
    existing slides.
- q_en: Does Canva have an API?
  a_en: >-
    Canva exposes a Connect API for assets, exports, and design automation; full AI features are not yet available via API.
- q_en: Can Canva AI remove backgrounds?
  a_en: >-
    Yes. The background remover is one of the most popular tools, included on Pro plans and above.
- q_en: Is Canva suitable for print?
  a_en: >-
    Yes. Pro unlocks CMYK export and high-resolution PNG/PDF suitable for print, including business cards, posters, and merch.
- q_en: Who should use Canva AI?
  a_en: >-
    Small business owners, marketers, teachers, and anyone who needs polished visuals without learning Photoshop.
