faq:
- q_en: What is Otter?
  a_en: >-
    Otter.ai is an AI meeting transcription and note-taking service that joins Zoom, Google Meet, and Teams to capture conversations
    in real time.
- q_en: Is Otter free?
  a_en: >-
    Yes. The free plan includes 300 minutes per month; Pro starts at $16.99/seat/month with more minutes and AI features.
- q_en: How accurate is Otter?
  a_en: >-
    Otter achieves high accuracy on clear English audio and improving accuracy on Mandarin and other major languages.
- q_en: Does Otter have an AI chat?
  a_en: >-
    Yes. Otter AI Chat can answer questions across past meetings, draft follow-up emails, and generate status updates from
    your meeting archive.
- q_en: Can Otter join meetings automatically?
  a_en: >-
    Yes. Connect your calendar and Otter auto-joins Zoom, Google Meet, and Microsoft Teams meetings you host or are invited
    to.
- q_en: Does Otter have an API?
  a_en: >-
    Yes. Otter exposes a REST API and webhooks for paid plans, popular for piping transcripts into CRMs and note apps.
- q_en: How is Otter different from Fireflies?
  a_en: >-
    Otter is a stronger individual note-taker with AI chat; Fireflies is stronger on CRM automation and team-wide search.
- q_en: Does Otter support speaker identification?
  a_en: >-
    Yes. Otter detects and labels different speakers automatically and you can correct labels afterwards.
- q_en: Is Otter suitable for lectures?
  a_en: >-
    Yes. Otter is widely used by students and academics; the free 300 min/month covers most semester workloads.
- q_en: Who should use Otter?
  a_en: >-
    Students, journalists, researchers, and professionals who need reliable transcripts and searchable meeting history.
