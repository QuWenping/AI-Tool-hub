editorialIntro: >-
  Sora 2 is OpenAI's text-to-video model and the current quality leader in 2026. Physics understanding, character consistency
  and 20-second clip length lead the category, though the price ceiling and safety filters are aggressive.
editorialVerdict:
  best: >-
    Quality is the priority and the budget exists — cinematic shots, character consistency and 20s clips beat the field.
  avoid: >-
    You need editing tools or 5–10s social clips — Runway or Pika are faster and cheaper.
