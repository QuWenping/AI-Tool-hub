faq:
- q_en: What is Aider?
  a_en: >-
    Aider is an open-source AI pair-programming tool that runs in your terminal. It edits files in your repo and auto-commits
    each change to Git.
- q_en: Is Aider free?
  a_en: >-
    Yes. Aider itself is free and open source (Apache 2.0). You only pay for the LLM API you point it at, or run it free with
    a local model.
- q_en: Which models does Aider support?
  a_en: >-
    Aider works with most frontier LLMs through API keys or local servers: DeepSeek, Claude, GPT, Gemini, Llama, Qwen, and
    Ollama-served models.
- q_en: How is Aider different from Cursor or Windsurf?
  a_en: >-
    Aider is purely a command-line tool with no GUI; it integrates with any editor via your terminal. Cursor and Windsurf
    are full IDEs with graphical UIs.
- q_en: Does Aider create Git commits?
  a_en: >-
    Yes. Every accepted change is committed with a descriptive message you can review with /undo.
- q_en: What languages does Aider work with?
  a_en: >-
    Aider handles Python, JavaScript, TypeScript, Go, Rust, Java, C/C++, Ruby, PHP and most other popular languages. It uses
    tree-sitter to map edits to existing code structure.
- q_en: Can Aider work on a whole repository?
  a_en: >-
    Yes. Aider builds a repo map of your codebase so the model can reason across files, useful for multi-file refactors.
- q_en: Does Aider need a code editor extension?
  a_en: >-
    No. Aider runs in a terminal and works alongside any editor (VS Code, Neovim, JetBrains, etc.) as a side process.
- q_en: How does Aider handle voice?
  a_en: >-
    Voice is not built in. You can pipe any system voice-to-text tool (Whisper, Mac Dictation) into Aider's input.
- q_en: Who should use Aider?
  a_en: >-
    Terminal-native developers who want fine-grained control, prefer open source, and already use Git heavily.
