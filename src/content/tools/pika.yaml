faq:
- q_en: What is Pika?
  a_en: >-
    Pika is an AI video generation platform that turns text, image, and video prompts into short cinematic clips, with strong
    motion and camera controls.
- q_en: Is Pika free?
  a_en: >-
    Yes. The free plan produces watermarked clips; paid plans start at $10/month for higher resolution and no watermark.
- q_en: How long can Pika videos be?
  a_en: >-
    Pika generates clips up to 10 seconds per generation on paid plans, which can be chained using Pikaffects or extended
    in the timeline.
- q_en: How does Pika compare to Sora?
  a_en: >-
    Pika emphasizes controllability — Pikaffects, motion strength, camera direction — while Sora leans on raw realism. Pika
    is faster and cheaper for iterative work.
- q_en: Does Pika support image-to-video?
  a_en: >-
    Yes. Image-to-video is one of Pika's strongest features: upload a still and Pika animates it with motion and camera prompts.
- q_en: Can I edit an existing video with Pika?
  a_en: >-
    Yes. Pika lets you upload a video and apply Pikaffects to restyle, re-light, or extend it.
- q_en: Does Pika have an API?
  a_en: >-
    Pika offers a developer API for paid accounts, suitable for batch rendering and app integration.
- q_en: What is Pikaffects?
  a_en: >-
    Pikaffects are one-click video transformations like 'melt', 'inflate', 'crush', 'cake-ify' applied to uploaded clips or
    images.
- q_en: Can Pika generate sound?
  a_en: >-
    Pika focuses on visuals; audio is not generated. Pair with ElevenLabs for voice and Suno for music.
- q_en: Who should use Pika?
  a_en: >-
    Creators and marketers producing short social clips, music videos, and stylized content where motion and effects matter
    more than photorealism.
