faq:
- q_en: What is Fireflies?
  a_en: >-
    Fireflies.ai is an AI meeting assistant that records, transcribes, and summarises meetings across Zoom, Google Meet, Teams,
    and Webex.
- q_en: Is Fireflies free?
  a_en: >-
    Yes. The free plan includes a limited number of transcription credits; paid plans start at $10/seat/month.
- q_en: How accurate is Fireflies transcription?
  a_en: >-
    Fireflies achieves high accuracy on clear English audio; noisy or accented audio benefits from manual speaker labelling
    and post-editing.
- q_en: Does Fireflies integrate with CRMs?
  a_en: >-
    Yes. Native integrations with Salesforce, HubSpot, Pipedrive, Zoho, and others auto-log meeting notes and call summaries
    to the right record.
- q_en: Can Fireflies answer questions about past meetings?
  a_en: >-
    Yes. AskFred is Fireflies' chat assistant that can search across your meeting archive and answer questions in natural
    language.
- q_en: Does Fireflies have an API?
  a_en: >-
    Yes. A REST API and webhooks are available, useful for piping meeting data into custom workflows or data warehouses.
- q_en: Is Fireflies GDPR compliant?
  a_en: >-
    Yes. Fireflies offers GDPR-compliant data handling, SOC 2 Type II, and configurable data retention policies on Business
    and above.
- q_en: Can Fireflies detect action items?
  a_en: >-
    Yes. Fireflies auto-detects tasks and decisions in the transcript and surfaces them in the summary and in integrated CRMs.
- q_en: Does Fireflies work in Chinese?
  a_en: >-
    Fireflies supports multiple languages including Mandarin, with quality improving for clearly pronounced audio.
- q_en: Who should use Fireflies?
  a_en: >-
    Sales teams, customer success, recruiters, and anyone whose calendar is full of meetings they need to remember and act
    on.
