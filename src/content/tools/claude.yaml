faq:
- q_en: What context length does Claude support?
  a_en: >-
    Claude Pro supports a 200K-token context window, enough for a 100+ page document in one prompt.
- q_en: Is Claude better than ChatGPT for writing?
  a_en: For long-form English writing with a natural voice, Claude is our top pick.
- q_en: Does Claude connect to the web?
  a_en: >-
    Native web browsing is limited today; use Perplexity or Gemini when live search is critical.
- q_en: Is Claude available worldwide?
  a_en: >-
    Availability varies by region. Anthropic publishes an up-to-date list of supported countries.
