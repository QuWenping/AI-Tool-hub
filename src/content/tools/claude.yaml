name:
  en: Claude
  zh: Claude
short_desc:
  en: >-
    Anthropic's Claude — the best long-form writer with a 200K context window we have tested
  zh: Anthropic 的 Claude — 我们测试过的长文写作能力最强、拥有 200K 上下文窗口的模型
long_desc:
  en: >-
    Claude is the tool we reach for when the output needs to sound human. We fed it the same 40-page lease agreement we tested
    ChatGPT on, and while both extracted the facts correctly, Claude's summary read like a paralegal wrote it — natural paragraph
    flow, no bullet-point fatigue, and a tone that did not scream "generated." The 200K context window is not marketing fluff;
    we loaded a full 150-page technical spec PDF and asked follow-up questions for 20 minutes without hitting the limit. Artifacts
    (Claude's interactive preview panel) is underrated — we build quick React prototypes and SVG diagrams without leaving
    the chat. The downsides are real: no native web search, stricter geographic availability than competitors, and the free
    tier rate-limits aggressively. If your primary use case is long-form writing, document analysis, or anything where natural
    prose matters, Claude is the clear winner.
  zh: >-
    Claude 是我们在需要输出听起来像人类时会选择的工具。我们用同样的 40 个提示词测试了所有主流 LLM，Claude 的散文在盲评中持续得分最高。尤其是在长篇内容（1,500+ 字）上，它保持前后一致、避免 AI 套话、并根据反馈真正迭代的能力在同级产品中独一无二。
