editorialIntro: >-
  Claude is Anthropic's answer to ChatGPT. In our long-form writing tests it produced the most natural English output among
  general assistants, and the 200K-token context window lets you paste 100+ pages in one prompt.
editorialVerdict:
  best: >-
    You write for a living. Long context, Artifacts and natural writing style are best-in-class at $20/month Pro.
  avoid: >-
    You rely on real-time web search (Perplexity or Gemini fit better) or need voice/image tools (ChatGPT Plus is more well-rounded).
