editorialIntro: >-
  Leonardo.AI is the specialist for game art, character design and concept art. Alchemy mode maintains style consistency across
  generations, Canvas is the most polished in-app editor, and the free tier is generous.
editorialVerdict:
  best: >-
    You are a game artist, character designer or concept artist and value consistent style across generations.
  avoid: >-
    Your work is generic image generation for blogs/social — Midjourney or DALL-E is simpler.
