faq:
- q_en: What is Krea?
  a_en: >-
    Krea is an AI image and video tool focused on real-time generation — you paint or sketch and the model updates the canvas
    live.
- q_en: Is Krea free?
  a_en: >-
    Yes. There is a free plan with a slow queue; paid plans start at $10/month for faster real-time output.
- q_en: How does Krea's real-time generation work?
  a_en: >-
    Krea streams a small diffusion model that re-generates the canvas continuously as you sketch, achieving sub-second feedback.
- q_en: Does Krea support video?
  a_en: >-
    Yes. Krea Video extends the same real-time UI to short video clips and keyframe animation.
- q_en: Can I use Krea for logos?
  a_en: >-
    Krea is great for ideation but final logo work usually needs a vector tool (Figma, Illustrator) and a dedicated typography
    model.
- q_en: Does Krea have an API?
  a_en: >-
    Krea is web-app only today; an API has been teased but is not generally available as of mid-2026.
- q_en: What is Krea Diffusion?
  a_en: >-
    Krea Diffusion is the company's text-to-image model that is also available through partner platforms like Replicate.
- q_en: How good is Krea for product mockups?
  a_en: >-
    Krea is strong for stylised mockups and concept art; for photoreal product shots, Flux Pro or Midjourney still lead.
- q_en: Can I bring my own LoRA to Krea?
  a_en: >-
    Paid plans allow private LoRAs trained on Krea, useful for consistent character or product looks.
- q_en: Who should use Krea?
  a_en: >-
    Designers, concept artists, and creative directors who iterate visually and want immediate feedback.
