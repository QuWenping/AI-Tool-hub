faq:
- q_en: What is v0?
  a_en: >-
    Vercel's AI-powered UI generator. Describe a component or page in natural language, and v0 generates production-ready
    React + Tailwind code with one-click deploy.
- q_en: Is v0 free?
  a_en: >-
    Free tier with limited monthly credits. Pro at $20/month adds more credits and priority access.
- q_en: What frameworks does v0 support?
  a_en: >-
    React, Next.js, and Vue with Tailwind CSS. Generated components are production-ready and follow accessibility best practices.
- q_en: Can v0 generate entire pages?
  a_en: >-
    Yes. Describe a landing page, dashboard, or form, and v0 generates the full layout with responsive design. You can iterate
    on specific sections.
- q_en: How does v0 compare to Bolt?
  a_en: >-
    v0 specializes in UI generation (React + Tailwind, one-click deploy to Vercel). Bolt is a full-stack app builder with
    a WebContainer runtime. Use v0 for UI, Bolt for full apps.
- q_en: Does v0 have an API?
  a_en: >-
    Yes. The v0 API allows you to generate UI components programmatically, making it possible to integrate into your design-to-code
    pipeline.
- q_en: Can v0 generate images?
  a_en: >-
    No. v0 generates UI code only. For images, use Midjourney, Flux, or DALL-E. For icons, use the bundled Lucide icon library.
- q_en: Is v0 good for design systems?
  a_en: >-
    Yes. You can describe your design tokens, components, and variants, and v0 generates a consistent component library that
    matches your brand.
- q_en: Can I edit v0 output in VS Code?
  a_en: >-
    Yes. Export the generated code and open it in any editor. The code is standard React/Vue + Tailwind with no proprietary
    lock-in.
- q_en: Who should use v0?
  a_en: >-
    Frontend developers who want to ship UI faster, designers who want to turn mockups into code, and full-stack devs who
    want to skip the boilerplate.
