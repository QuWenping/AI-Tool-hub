faq:
- q_en: What is Flux?
  a_en: >-
    Flux is a family of image generation models from Black Forest Labs, the team behind Stable Diffusion. Flux.1 ships in
    Pro, Dev, and Schnell variants.
- q_en: Is Flux better than Midjourney?
  a_en: >-
    Flux.1 Pro produces competitive photorealism and excellent prompt adherence; Midjourney still leads in painterly aesthetics.
    Choose by use case.
- q_en: How much does Flux cost?
  a_en: >-
    Flux is usage-based via the Black Forest Labs API. Flux.1 Pro is roughly $0.05 per 1MP image; Schnell (faster) is cheaper.
- q_en: Does Flux have a free tier?
  a_en: >-
    Sign-up credits are available, after which it is paid. The open-weight Schnell and Dev variants can be self-hosted for
    free on your own GPUs.
- q_en: Can I self-host Flux?
  a_en: >-
    Yes. The non-commercial FLUX.1 [schnell] and FLUX.1 [dev] weights are released under Apache 2.0 / FLUX.1-dev Non-Commercial
    License respectively.
- q_en: What integrations support Flux?
  a_en: >-
    Flux is available on Replicate, fal.ai, Together AI, and through ComfyUI, with new integrations shipping monthly.
- q_en: Is Flux good for typography in images?
  a_en: >-
    Flux.1 is markedly better at rendering legible text in images than earlier open models, but Ideogram still leads at very
    long or multilingual strings.
- q_en: How big is Flux's model?
  a_en: >-
    FLUX.1 [pro] is a 12B parameter rectified flow transformer. Dev and Schnell are similar scale with different training
    recipes.
- q_en: Does Flux support LoRA and ControlNet?
  a_en: >-
    The open-weight Dev variant supports LoRA training and ControlNet-style conditioning through ComfyUI and diffusers.
- q_en: Who should use Flux?
  a_en: >-
    Teams that need a flexible image model with both an API and self-hosting path, especially if text-in-image accuracy matters.
