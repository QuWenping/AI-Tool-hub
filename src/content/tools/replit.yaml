faq:
- q_en: What is Replit?
  a_en: >-
    A browser-based cloud IDE with built-in AI. You can code, run, and deploy apps without installing anything. The 2026 Agent
    mode can build entire features from a description.
- q_en: Is Replit free?
  a_en: >-
    Free tier includes limited compute and AI credits. Core at $20/month removes the limits and adds the AI agent with full
    context.
- q_en: Can Replit deploy apps?
  a_en: >-
    Yes. One-click deploy with a generated URL. Static sites, Node.js, Python, and Go apps are supported. Custom domains on
    paid plans.
- q_en: Is Replit good for learning to code?
  a_en: >-
    Yes. Zero setup, browser-based, and the AI agent explains code as it generates it. Widely used in CS education programs.
- q_en: How does Replit compare to Cursor?
  a_en: >-
    Replit is browser-based and requires no setup — ideal for quick prototypes and learning. Cursor is a local IDE with deeper
    codebase understanding and better for large projects.
- q_en: What languages does Replit support?
  a_en: >-
    50+ languages including Python, JavaScript, TypeScript, Go, Rust, C++, Java, HTML/CSS, Bash, and SQL. Python and JavaScript
    have the best AI support.
- q_en: Can teams collaborate on Replit?
  a_en: >-
    Yes. Teams plan includes multiplayer editing, shared secrets, and team workspaces. Multiple developers can edit the same
    repl simultaneously.
- q_en: Is Replit's Agent mode worth the upgrade?
  a_en: >-
    If you build features frequently, yes. The Agent can scaffold, debug, and deploy autonomously — saving hours per feature.
    The free tier is good for occasional use.
- q_en: Can Replit run scheduled tasks?
  a_en: >-
    Yes, with the Always-On feature (paid plans). You can keep a web server running or schedule cron jobs. The free tier sleeps
    after inactivity.
- q_en: Who should use Replit?
  a_en: >-
    Students learning to code, developers prototyping quickly, educators teaching programming, and anyone who wants to code
    from any device without setup.
