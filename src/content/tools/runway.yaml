editorialIntro: >-
  Runway is the veteran of AI video and still the most production-ready tool in the category. Gen-3 Alpha plus motion brush,
  inpainting, storyboard and Gen-3 upscale make it the default for creators who ship more than one-off clips.
editorialVerdict:
  best: >-
    You are a creative professional shipping ads, music videos or short films. Motion brush, inpainting and storyboard are
    unmatched.
  avoid: >-
    You only need one-off social clips or the tightest budget — Kling free tier or Hailuo covers that.
