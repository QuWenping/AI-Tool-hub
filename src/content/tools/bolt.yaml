pricingSummary:
  en: >-
    Free tier with limited daily tokens · Pro $20/mo (2x faster AI, larger context) · Enterprise for teams.
faq:
- q_en: Is Bolt free to use?
  a_en: >-
    Yes, with a daily token limit. Pro at $20/month removes the cap and gives faster inference.
- q_en: Can Bolt build production apps?
  a_en: >-
    Best for MVPs, prototypes, and internal tools. Complex production apps with many dependencies may hit the WebContainer
    sandbox limits. Bolt is excellent for quick validation.
- q_en: How does Bolt compare to Lovable?
  a_en: >-
    Bolt runs in a browser-based WebContainer and is better for React/Node.js stacks. Lovable integrates with Supabase out
    of the box and is better for full-stack apps with databases.
- q_en: Does Bolt support GitHub integration?
  a_en: >-
    Yes. You can push directly to a GitHub repository from the Bolt editor. One-click deploy to Vercel or Netlify is also
    available.
- q_en: What tech stacks does Bolt support?
  a_en: >-
    React, Next.js, Vue, Svelte, Node.js, Express, Python (FastAPI), and most npm packages. The WebContainer sandbox has some
    limitations on native OS calls.
- q_en: Can Bolt generate APIs?
  a_en: >-
    Yes. Bolt can scaffold REST and GraphQL APIs with Node.js or Python. For production API hosting, you will want to move
    the code to a dedicated server.
- q_en: Is Bolt suitable for learning to code?
  a_en: >-
    Very. The zero-config environment and browser-based IDE let beginners build real apps immediately without worrying about
    setup.
- q_en: What are the main alternatives to Bolt?
  a_en: >-
    Lovable (Supabase + full-stack), v0 (Vercel UI), Replit (cloud IDE), and Cursor (local IDE). Each has a different strength.
- q_en: Can Bolt work offline?
  a_en: >-
    No. Bolt runs entirely in the browser and requires a network connection for both the AI and the WebContainer runtime.
- q_en: Who should use Bolt?
  a_en: >-
    Founders building MVPs, developers prototyping ideas quickly, and anyone who wants to go from idea to working app in minutes.
